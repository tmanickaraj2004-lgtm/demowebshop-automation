[pytest]
testpaths = tests
addopts = -v --html=reports/report.html --self-contained-html
markers =
    module1: Module 1 - e-commerce flows (projects 1-3)
    module2: Module 2 - cross-browser and UI validation (projects 4-6)
    module3: Module 3 - data-driven testing (projects 7-9)
    smoke: quick sanity tests
    negative: negative scenarios
    data_driven: tests driven by CSV/Excel/DB data
    ui: UI / CSS / responsive tests
